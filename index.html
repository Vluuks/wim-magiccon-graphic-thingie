<html>

    <head>
        <style>
            .img-uploaded {
                width:750px;
                height:750px;
                object-fit: cover;
                object-position: center;
                padding-left:90px;
                padding-top:340px;
                position:absolute;
            }

            .img-graphic {
                position:absolute;
                z-index: 1000;
            }
        </style>
    </head>

    <body>
        <div class="main">
            <h1>Create your own WIM style "I will be coming to MagicCon" graphic! </h1>
            <p>A square photo of about 750x750 pixels works best because I was too lazy to code this properly. .png, .jpg and .jpeg accepted.</p>
            
            <form class="form">
                <div class="form-group">
                    <div class="col-sm-10">
                        <input type="file" class="form-control" name="photo" id="photo" accept=".png, .jpg, .jpeg" onchange="readFile(this);">
                    </div>
                </div>
            </form>
            
            <div id ="photoscontainer">
                <div class="img-graphic"><img src="main-graphic.png"></div>
                <div id="userphoto"></div>
            
            </div>
        </div>
    </body>

    <script>
        function readFile(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();

                reader.onload = function (e) {
                    document.getElementById("userphoto").innerHTML = '<div class="col-md-3 col-sm-3 col-xs-3"><img src="'+e.target.result+'" class="img-uploaded"></div>';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

</html>
